# Alaprajz szerkesztő az nginx HTTPS szerverblokkjában (/floorplan/ alútvonal).
#
# A meglévő /etc/nginx/sites-available/my-life fájl "listen 443 ssl" szerverblokkjába,
# a "location / {" sor ELÉ kell beírni ezt az egy sort:
#
#   include /home/gdaniel1979/my_projects/floorplan/deploy/nginx-floorplan.conf;
#
# Az app statikus (build-lépés nincs), ezért az nginx közvetlenül a repóból
# szolgálja ki — nem kell hozzá a devserve.py, sem nyitott 8001-es port. A
# repóban lévő fájlok minden mentés után azonnal élesek.

location = /floorplan {
    return 301 /floorplan/;
}

# „Mentés a My Life-ba” (js/modules/publish.js): a rajzokat a My Life fogadója veszi át
# (my_life/sync/floorplan_publish.py, csak 127.0.0.1:8612-n figyel, a My Life belépési sütijét ellenőrzi).
location = /floorplan/publish/ {
    proxy_pass http://127.0.0.1:8612/floorplan/publish/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 8m;
    add_header Cache-Control "no-store" always;
}

location /floorplan/ {
    alias /home/gdaniel1979/my_projects/floorplan/;
    index index.html;
    autoindex off;

    # mindig újraellenőrzi a böngésző (ETag alapján) — a módosítások azonnal
    # látszanak, de a változatlan fájlok nem töltődnek le újra
    add_header Cache-Control "no-cache" always;

    # rejtett és munka útvonalak (.git, .claude, .ipynb_checkpoints, !munka …)
    # nem szolgálhatók ki — ugyanaz a szabály, mint a devserve.py-ban
    location ~ /[.!] {
        return 404;
    }
}
